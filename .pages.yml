
# One image library; site images retain their existing paths.
media:
  - name: images
    label: Images
    input: public/images
    output: /images
    rename: safe
    categories: [image]

content:
  # =========================
  # Rabbit Holes
  # =========================
  - name: rabbit-holes
    label: Rabbit Holes
    type: collection
    path: src/content/rabbit-holes
    format: yaml-frontmatter

    filename:
      template: "{primary}.md"
      field: create

    view:
      fields: [title, category, date]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc

    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: description
        label: Description
        type: text
        required: true

      - name: category
        label: Category
        type: string
        required: true

      - name: date
        label: Date
        type: date
        required: true
        options:
          format: yyyy-MM-dd

      - name: body
        label: Content
        type: rich-text
        options:
          format: markdown
          switcher: true
          media: images
          path: public/images/rabbit-holes

  # =========================
  # Projects
  # =========================
  - name: projects
    label: Projects
    type: collection
    path: src/content/projects
    format: yaml-frontmatter

    filename:
      template: "{primary}.md"
      field: create

    view:
      fields: [title, date, tags]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc

    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: description
        label: Description
        type: text
        required: true

      - name: date
        label: Date
        type: date
        required: true
        options:
          format: yyyy-MM-dd

      - name: tags
        label: Tags
        type: string
        list: true

      - name: image
        label: Cover Image
        type: image
        options:
          media: images
          path: public/images/projects

      - name: github
        label: GitHub URL
        type: string

      - name: body
        label: Project Content
        type: rich-text
        options:
          format: markdown
          switcher: true
          media: images
          path: public/images/projects

  # =========================
  # Certificates
  # =========================
  - name: certificates
    label: Certificates
    type: collection
    path: src/content/certificates
    format: yaml-frontmatter

    filename:
      template: "{primary}.md"
      field: create

    view:
      fields: [title, issuer, type, endDate]
      primary: title
      sort: [endDate, title]
      default:
        sort: endDate
        order: desc

    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: issuer
        label: Issuer
        type: string
        required: true

      - name: image
        label: Certificate Image
        type: image
        required: true
        options:
          media: images
          path: public/images/certificates

      
      - name: type
        label: Certificate Type
        type: select
        required: true
        options:
          values:
            - name: certification
              label: Exam-Based Certification
            - name: completion
              label: Course / Path Completion

      - name: startDate
        label: Start Date
        type: date
        default: ""
        options:
          format: yyyy-MM-dd

      - name: endDate
        label: Completion Date
        type: date
        default: ""
        options:
          format: yyyy-MM-dd


      - name: credentialUrl
        label: Credential URL
        type: string

      - name: body
        label: Certificate Details
        type: rich-text
        options:
          format: markdown
          switcher: true


  # =========================
  # The Log - one JSON list, editable in Pages CMS
  # =========================
  - name: log
    label: The Log
    type: file
    path: src/data/log.json
    format: json
    list: true

    fields:
      - name: date
        label: Date
        type: date
        required: true
        options:
          format: yyyy-MM-dd

      - name: category
        label: Category
        type: select
        required: true
        options:
          values:
            - name: project
              label: Project
            - name: event
              label: Event
            - name: learning
              label: Learning
            - name: milestone
              label: Milestone

      - name: title
        label: Title
        type: string
        required: true

      - name: link
        label: Link (optional)
        type: string

  # =========================
  # Currently
  # =========================
  - name: currently
    label: Currently
    type: file
    path: src/data/currently.json
    format: json

    fields:
      - name: mainQuest
        label: Main Quest
        type: object
        fields:
          - name: title
            label: Title
            type: string
            required: true

          - name: status
            label: Status
            type: string

          - name: description
            label: Description
            type: text

      - name: sideQuests
        label: Side Quests
        type: object
        list:
          min: 2
          max: 2
        fields:
          - name: title
            label: Title
            type: string
            required: true

          - name: description
            label: Description
            type: text

  # =========================
  # Maybe, Someday
  # =========================
  - name: maybe
    label: Maybe, Someday
    type: file
    path: src/data/maybe.json
    format: json
    list: true

    fields:
      - name: title
        label: Idea
        type: string
        required: true

      - name: done
        label: Done
        type: boolean
        default: false

      - name: link
        label: Link (optional)
        type: string
